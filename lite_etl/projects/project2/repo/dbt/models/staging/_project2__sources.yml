version: 2

sources:
  - name: raw
    description: Landed source data (extract/billing, extract/crm, extract/ref). In the
      local demo these are the raw_* tables built by demo/load.py.
    schema: "{{ env_var('RAW_SCHEMA', 'main') }}"
    tables:
      - name: raw_invoices
        description: One row per invoice as sent by the billing API; webhook retries re-send the same invoice_id.
        columns:
          - name: invoice_id
            tests: [not_null]
      - name: raw_subscriptions
        description: One row per subscription; mid-period plan changes appear as a new row.
      - name: raw_accounts
        description: Daily CRM snapshot; contains PII (billing_email) and merged-account pointers.
      - name: raw_plans
        description: Plan catalogue (hand-maintained CSV).
      - name: raw_fx_rates
        description: FX rate per currency per month-start; gaps are expected.
