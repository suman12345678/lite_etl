version: 2

sources:
  - name: raw
    description: Landed source data (extract/oltp, extract/fx). In the local demo these
      are the raw_* tables built by demo/load.py.
    schema: "{{ env_var('RAW_SCHEMA', 'main') }}"
    tables:
      - name: raw_orders
        description: One row per order as sent by the OLTP DB; may be re-sent with a newer loaded_at.
        columns:
          - name: order_id
            tests: [not_null]
      - name: raw_customers
        description: Customer master; contains PII (email) that must not reach marts.
      - name: raw_fx_rates
        description: Daily FX rate per currency; weekend/holiday gaps are expected.
