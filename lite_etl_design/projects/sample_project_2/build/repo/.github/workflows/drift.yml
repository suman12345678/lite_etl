# Nightly terraform plan per env; a non-empty plan alerts + opens an issue.
# ref: pipeline/cicd-plan.md "drift.yml" + deployment-and-iac.md s.7.
name: drift

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  plan:
    runs-on: [self-hosted, northwind, "${{ matrix.env }}"]
    strategy:
      matrix:
        env: [dev, stg, prd]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::TODO_ACCT:role/northwind-${{ matrix.env }}-ci
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@v3
      - id: plan
        run: |
          cd infra/envs/${{ matrix.env }}
          terraform init
          set +e
          terraform plan -detailed-exitcode -var-file=${{ matrix.env }}.tfvars -out=tfplan
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.exit == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({ ...context.repo,
              title: `drift detected in ${{ matrix.env }}`,
              labels: ['drift', '${{ matrix.env }}'],
              body: 'Nightly `terraform plan` in `infra/envs/${{ matrix.env }}` is non-empty. Investigate console changes.' });
      - if: steps.plan.outputs.exit == '2'
        run: echo "TODO post to #northwind-platform Slack"
