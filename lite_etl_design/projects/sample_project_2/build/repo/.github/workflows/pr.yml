# PR checks - lint / unit / dbt slim build / terraform plan / security.
# ref: pipeline/cicd-plan.md "pr.yml". Phase 4 scaffold - account values are TODO.
name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write        # OIDC -> northwind-<env>-ci
  pull-requests: write   # tf plan comment

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: sqlfluff lint dbt/models
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --chdir=infra

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"
      - run: make test          # pytest (80% cov gate) + dbt build --target ci on DuckDB
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: .coverage }

  dbt-slim:
    runs-on: [self-hosted, northwind, dev]   # needs VPC access to northwind_dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::TODO_DEV_ACCT:role/northwind-dev-ci
          aws-region: eu-west-2
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]" dbt-databricks~=1.8.0
      - name: fetch prod manifest
        run: aws s3 cp s3://northwind-prd-lakehouse/_manifests/dbt/manifest.json prod-manifest/  # TODO path
      - name: slim build on a throwaway CI schema
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          cd dbt
          dbt build --select state:modified+ --defer --state ../prod-manifest \
            --target dev --vars '{ci_schema: ci_pr_${{ github.event.number }}}'
      - uses: actions/upload-artifact@v4
        with: { name: elementary-report, path: dbt/edr_target/ }

  tf-plan:
    runs-on: [self-hosted, northwind, dev]
    strategy:
      matrix:
        env: [dev, stg, prd]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::TODO_ACCT:role/northwind-${{ matrix.env }}-ci
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@v3
      - name: plan
        run: |
          cd infra/envs/${{ matrix.env }}
          terraform init
          terraform plan -var-file=${{ matrix.env }}.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: guard - no unlabelled destroy of a stateful resource
        run: |
          if grep -qE '^  # .* will be destroyed' infra/envs/${{ matrix.env }}/plan.txt \
             && ! ${{ contains(github.event.pull_request.labels.*.name, 'destroy-ok') }}; then
            echo "::error::destroy in plan without a destroy-ok label"; exit 1
          fi
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```\n' + fs.readFileSync('infra/envs/${{ matrix.env }}/plan.txt','utf8').slice(0, 60000) + '\n```';
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `### terraform plan — ${{ matrix.env }}\n${body}` });

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system pip-audit && pip-audit || true   # TODO fail on high in Phase 5
