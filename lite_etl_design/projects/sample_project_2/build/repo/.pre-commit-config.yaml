# ref: pipeline/git-workflow.md "Pre-commit hooks". `make setup` runs `pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks: [{id: ruff}, {id: ruff-format}]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.0
    hooks: [{id: sqlfluff-lint, files: ^dbt/models/}]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - {id: terraform_fmt}
      - {id: terraform_validate, files: ^infra/}
      - {id: terraform_tflint, args: ["--args=--chdir=infra"]}

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks: [{id: gitleaks}]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks: [{id: detect-secrets, args: ["--baseline", ".secrets.baseline"]}]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - {id: end-of-file-fixer}
      - {id: trailing-whitespace}
      - {id: check-added-large-files, args: ["--maxkb=512"]}
      - {id: check-yaml}
      - {id: check-merge-conflict}

  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse
        entry: bash -c 'cd dbt && dbt parse'
        language: system
        pass_filenames: false
        stages: [manual]   # run in CI / on demand, not on every commit
