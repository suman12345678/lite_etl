version: 2
sources:
  - name: fx
    schema: bronze
    loaded_at_field: _extracted_at
    freshness:
      warn_after: {count: 8, period: hour}     # fx is daily (requirements/07)
      error_after: {count: 30, period: hour}
    tables:
      - name: rate
        identifier: fx__rate
        columns:
          - name: currency
            data_tests: [not_null]
          - name: rate_per_usd
          - name: rate_date
