[project]
name = "northwind-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "pyarrow>=16",
  "structlog>=24",
  "boto3>=1.34",
  "duckdb>=1.1",          # local demo + `dbt --target ci` engine (see demo/ and DEMO.md)
  # TODO: psycopg[binary], google-cloud-bigquery, deltalake, simple-salesforce, openlineage-python
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.5", "mypy>=1.10",
  "dbt-core~=1.8.0", "dbt-duckdb~=1.8.0", "sqlfluff>=3",
  # runtime target: dbt-databricks~=1.8.0
]
# Phase 4 - the Dagster code location (northwind_dagster/). Not needed for unit tests.
orchestration = [
  "dagster~=1.8", "dagster-dbt~=0.24", "dagster-aws~=0.24",
  # deploy-time: dagster-cloud  (cloud_agent mode)
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --cov=extractors --cov=recon --cov=publish --cov=lineage --cov=obs"

[tool.ruff]
target-version = "py312"
line-length = 100
